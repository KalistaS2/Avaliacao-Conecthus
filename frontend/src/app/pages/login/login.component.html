<div class="login-wrapper">
  @if (notificationService.notification(); as notif) {
    <app-notificacao
      [title]="notif.title"
      [message]="notif.message"
      [type]="notif.type"
      (dismiss)="notificationService.dismiss()"
    ></app-notificacao>
  }

  <!-- Tela de Login Principal com Animação de Entrada -->
  <div class="login-content">
    <div class="left-brand">
      <img src="conecthus-logo.svg" alt="Conecthus Logo" class="brand-logo-large" />
    </div>

    <div class="right-card">
      <div class="card-inner">
        <h2>Bem-vindo!</h2>
        <p class="subtitle">Entre com sua conta</p>

        @if (errorMessage) {
          <div class="error-alert">
            {{ errorMessage }}
          </div>
        }

        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label for="login">E-mail ou Matrícula</label>
            <input
              type="text"
              id="login"
              name="login"
              [(ngModel)]="loginInput"
              placeholder="E-mail ou Nº matrícula"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="passwordInput"
              placeholder="Senha"
              required
            />
          </div>

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            @if (!isLoading) {
              <span>Entrar</span>
            } @else {
              <span class="spinner"></span>
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
